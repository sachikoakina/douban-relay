name: douban-relay

on:
  schedule:
    # GitHub 定时最短 5 分钟；20 分钟一次足以覆盖豆瓣 10 条窗口
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: douban-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install feedparser==6.0.11

      - name: 校验 DOUBAN_UID 是否已配置
        env:
          DOUBAN_UID: ${{ vars.DOUBAN_UID || secrets.DOUBAN_UID }}
        run: |
          if [ -z "$DOUBAN_UID" ]; then
            echo "::error::未配置 DOUBAN_UID。请到 Settings → Secrets and variables → Actions 新建 Variable 或 Secret，名称 DOUBAN_UID，值为豆瓣数字 ID。"
            exit 1
          fi
          case "$DOUBAN_UID" in
            ''|*[!0-9]*)
              echo "::error::DOUBAN_UID 必须是纯数字（打开 https://www.douban.com/people/你的ID/ 地址栏里的那串数字）"
              exit 1 ;;
          esac
          echo "DOUBAN_UID 已配置（${#DOUBAN_UID} 位数字）"

      - name: 抓取、去重、归档并生成 RSS
        env:
          # 优先取仓库 Variable，其次 Secret；两者都为空时由 relay.py 报错退出
          DOUBAN_UID: ${{ vars.DOUBAN_UID || secrets.DOUBAN_UID }}
          # 可选：自定义域名时填；留空则按 GITHUB_REPOSITORY 自动推导 Pages 地址
          SITE_URL: ${{ vars.SITE_URL }}
          ITEM_LIMIT: ${{ vars.ITEM_LIMIT }}
          PRESETS: ${{ vars.PRESETS }}
          MAX_STORE: ${{ vars.MAX_STORE }}
        run: python relay.py

      - name: 有新增时提交（无新增不产生提交）
        run: |
          git config user.name "douban-relay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json feed/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "relay: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时尝试用 workflow token 自动创建站点，
          # 免去手动去 Settings → Pages 点一次（需要 pages: write，已在上方声明）
          enablement: true

      - name: 打包 feed 目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: feed

      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
